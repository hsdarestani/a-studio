{% load i18n %}
{% get_current_language as CURRENT_LANGUAGE %}
<form class="language-switcher" action="{% url 'set_language' %}" method="post">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button type="submit" name="language" value="de" class="{% if CURRENT_LANGUAGE == 'de' %}active{% endif %}" aria-label="Deutsch">DE</button>
  <span></span>
  <button type="submit" name="language" value="en" class="{% if CURRENT_LANGUAGE == 'en' %}active{% endif %}" aria-label="English">EN</button>
</form>
