name: Verify production integrations

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'agent/integration-smoke-trigger' && github.actor == 'hsdarestani'
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
      - name: Test Strato email and GitHub provisioning
        env:
          SSHPASS: ${{ secrets.PASS }}
          HOST: ${{ secrets.HOST }}
        run: |
          sshpass -e ssh -o ConnectTimeout=20 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/a-studio/current
          docker compose exec -T web python manage.py shell <<'PY'
          from django.conf import settings
          from django.core.mail import send_mail
          import requests

          if not settings.EMAIL_HOST_PASSWORD:
              raise RuntimeError("EMAILPASSWORD is not present in production")
          if not settings.GITHUB_TOKEN:
              raise RuntimeError("GITHUBTOKEN is not present in production")

          sent = send_mail(
              subject="A+ Studio integration test",
              message="Strato SMTP is connected successfully to A+ Studio production.",
              from_email=settings.DEFAULT_FROM_EMAIL,
              recipient_list=["app@aplus-solution.de"],
              fail_silently=False,
          )
          if sent != 1:
              raise RuntimeError(f"Email backend returned {sent}")
          print("EMAIL_OK: Strato accepted the test message")

          owner = settings.GITHUB_OWNER
          repo_name = "astudio-integration-smoke"
          headers = {
              "Authorization": f"Bearer {settings.GITHUB_TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          response = requests.get(
              f"https://api.github.com/repos/{owner}/{repo_name}",
              headers=headers,
              timeout=30,
          )
          if response.status_code == 404:
              response = requests.post(
                  "https://api.github.com/user/repos",
                  headers=headers,
                  json={
                      "name": repo_name,
                      "description": "A+ Studio private repository provisioning smoke test. Safe to keep or delete.",
                      "private": True,
                      "auto_init": True,
                  },
                  timeout=30,
              )
              action = "created"
          else:
              action = "already exists"
          response.raise_for_status()
          repository = response.json()
          if not repository.get("private"):
              raise RuntimeError("Smoke-test repository is not private")
          print(f"GITHUB_OK: {repository['full_name']} ({action}, private)")
          PY
          REMOTE
