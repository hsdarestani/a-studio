name: Diagnose Flavor build

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/diagnose-flavor-build' && github.actor == 'hsdarestani'
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
      - name: Inspect production task, services and credentials
        env:
          SSHPASS: ${{ secrets.PASS }}
          HOST: ${{ secrets.HOST }}
        run: |
          sshpass -e ssh -o ConnectTimeout=20 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST" 'bash -s' <<'REMOTE'
          set +e
          cd /opt/a-studio/current || exit 1
          echo '=== CONTAINERS ==='
          docker compose ps -a
          echo '=== CONFIGURED FLAGS ==='
          docker compose exec -T web python manage.py shell <<'PY'
          import json
          from django.conf import settings
          from core.models import Project

          project = Project.objects.filter(name__iexact='Flavor').order_by('-created_at').first()
          print(json.dumps({
              'openai_configured': bool(settings.OPENAI_API_KEY),
              'github_configured': bool(settings.GITHUB_TOKEN),
              'github_owner': settings.GITHUB_OWNER,
              'app_data_root': str(settings.APP_DATA_ROOT),
              'project_found': bool(project),
          }, ensure_ascii=False))
          if project:
              print('PROJECT', json.dumps({
                  'id': str(project.id),
                  'slug': project.slug,
                  'status': project.status,
                  'version': project.version,
                  'repo_name': project.repo_name,
                  'repo_url': project.repo_url,
                  'preview_url': project.preview_url,
                  'last_build_error': project.last_build_error,
                  'updated_at': project.updated_at.isoformat(),
              }, ensure_ascii=False))
              for message in project.conversation.messages.order_by('-created_at')[:6]:
                  print('MESSAGE', json.dumps({
                      'id': str(message.id),
                      'role': message.role,
                      'status': message.status,
                      'task_id': message.task_id,
                      'content': message.content[:300],
                      'metadata': message.metadata,
                      'created_at': message.created_at.isoformat(),
                  }, ensure_ascii=False, default=str))
              for deployment in project.deployments.order_by('-created_at')[:6]:
                  print('DEPLOYMENT', json.dumps({
                      'id': str(deployment.id),
                      'status': deployment.status,
                      'version': deployment.version,
                      'log': deployment.log[:1200],
                      'created_at': deployment.created_at.isoformat(),
                  }, ensure_ascii=False, default=str))
              for feature in project.feature_requests.order_by('-created_at')[:6]:
                  print('FEATURE', json.dumps({
                      'id': str(feature.id),
                      'title': feature.title,
                      'status': feature.status,
                      'credits': feature.credits,
                      'created_at': feature.created_at.isoformat(),
                  }, ensure_ascii=False, default=str))
          PY
          echo '=== WORKER LOGS ==='
          docker compose logs --no-color --since=90m worker 2>&1 | tail -n 260
          echo '=== SANDBOX LOGS ==='
          docker compose logs --no-color --since=90m sandbox 2>&1 | tail -n 180
          echo '=== WEB LOGS ==='
          docker compose logs --no-color --since=90m web 2>&1 | tail -n 180
          REMOTE