name: Create Apple reviewer account

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/create-apple-review-account.yml'

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Generate reviewer credentials
        shell: bash
        run: |
          set -euo pipefail
          REVIEW_EMAIL='app-review@studio.aplus-solution.de'
          REVIEW_PASSWORD="$(python - <<'PY'
          import secrets, string
          alphabet = string.ascii_letters + string.digits
          print('ASa!' + ''.join(secrets.choice(alphabet) for _ in range(22)))
          PY
          )"
          echo "::add-mask::$REVIEW_PASSWORD"
          {
            echo "REVIEW_EMAIL=$REVIEW_EMAIL"
            echo "REVIEW_PASSWORD=$REVIEW_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Create companion-only reviewer account
        env:
          SSHPASS: ${{ secrets.PASS }}
          HOST: ${{ secrets.HOST }}
        shell: bash
        run: |
          set -euo pipefail
          email_b64="$(printf '%s' "$REVIEW_EMAIL" | base64 -w0)"
          password_b64="$(printf '%s' "$REVIEW_PASSWORD" | base64 -w0)"
          sshpass -e ssh -o ConnectTimeout=20 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST" \
            "REVIEW_EMAIL_B64='$email_b64' REVIEW_PASSWORD_B64='$password_b64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/a-studio/current
          export REVIEW_EMAIL="$(printf '%s' "$REVIEW_EMAIL_B64" | base64 -d)"
          export REVIEW_PASSWORD="$(printf '%s' "$REVIEW_PASSWORD_B64" | base64 -d)"
          docker compose exec -T \
            -e REVIEW_EMAIL="$REVIEW_EMAIL" \
            -e REVIEW_PASSWORD="$REVIEW_PASSWORD" \
            web python manage.py shell <<'PY'
          import os
          from django.contrib.auth import get_user_model
          from core.models import (
              CreditTransaction,
              FeatureRequest,
              Membership,
              Organization,
              Project,
              StoreSubmission,
          )

          User = get_user_model()
          email = os.environ['REVIEW_EMAIL'].strip().lower()
          password = os.environ['REVIEW_PASSWORD']

          user = User.objects.filter(email__iexact=email).first()
          if user is None:
              user = User(username=email, email=email)
          user.username = email
          user.email = email
          user.first_name = 'App'
          user.last_name = 'Reviewer'
          user.is_active = True
          user.set_password(password)
          user.save()

          membership = Membership.objects.select_related('organization').filter(user=user).first()
          if membership:
              organization = membership.organization
          else:
              organization = Organization.objects.create(
                  name='A+ Studio App Review',
                  owner=user,
                  billing_email=email,
                  plan='starter',
                  credits=0,
              )
              Membership.objects.create(organization=organization, user=user, role='owner')

          organization.name = 'A+ Studio App Review'
          organization.owner = user
          organization.billing_email = email
          organization.plan = 'starter'
          organization.credits = 0
          organization.active = True
          organization.save()

          organization.projects.all().delete()
          CreditTransaction.objects.filter(organization=organization).delete()

          project = Project.objects.create(
              organization=organization,
              created_by=user,
              name='Luna Booking',
              business_type='Friseursalon',
              description=(
                  'Projektbegleitung für eine Termin- und Kunden-App. '
                  'Die iOS-App zeigt Projektstatus, Briefing, Änderungswünsche '
                  'und vorhandenen Veröffentlichungsstatus nur zur Koordination.'
              ),
              language='de',
              status='draft',
              version=4,
          )

          FeatureRequest.objects.create(
              project=project,
              requested_by=user,
              title='Buchungsablauf abstimmen',
              description='Bitte die Anforderungen für die Wochenansicht und freie Termine mit dem Projektteam abstimmen.',
              size='custom',
              credits=0,
              status='proposed',
          )
          FeatureRequest.objects.create(
              project=project,
              requested_by=user,
              title='Kontaktbereich geprüft',
              description='Kontaktangaben und Öffnungszeiten wurden mit dem Projektteam abgestimmt.',
              size='custom',
              credits=0,
              status='done',
          )

          StoreSubmission.objects.create(
              project=project,
              requested_by=user,
              platform='ios',
              status='review',
              notes='Read-only distribution status shown in the iOS companion app.',
              eligibility_report={'mobile_read_only': True},
          )

          print('review_account=ready')
          print('workspace=' + organization.name)
          print('project=' + project.name)
          print('project_status=' + project.status)
          print('credits=' + str(organization.credits))
          PY
          REMOTE

      - name: Verify public companion review flow
        shell: bash
        run: |
          set -euo pipefail
          payload="$(python - <<'PY'
          import json, os
          print(json.dumps({'email': os.environ['REVIEW_EMAIL'], 'password': os.environ['REVIEW_PASSWORD']}))
          PY
          )"
          login_response="$(curl -4 -fsS --connect-timeout 15 --max-time 30 \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            https://studio.aplus-solution.de/api/mobile/login/)"
          token="$(python - "$login_response" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          if not data.get('ok') or not data.get('token'):
              raise SystemExit('Reviewer login verification failed')
          user = data.get('user') or {}
          org = user.get('organization') or {}
          for forbidden in ('credits', 'plan'):
              if forbidden in org:
                  raise SystemExit(f'Forbidden mobile entitlement exposed: {forbidden}')
          print(data['token'])
          PY
          )"
          dashboard="$(curl -4 -fsS --connect-timeout 15 --max-time 30 \
            -H "Authorization: Bearer $token" \
            https://studio.aplus-solution.de/api/mobile/dashboard/)"
          project_id="$(python - "$dashboard" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          projects = data.get('projects') or []
          if not data.get('ok') or not projects:
              raise SystemExit('Reviewer dashboard has no project')
          project = projects[0]
          for forbidden in ('preview_url', 'live_url', 'repo_url', 'deployment'):
              if forbidden in project:
                  raise SystemExit(f'Forbidden builder field exposed: {forbidden}')
          print(project['id'])
          PY
          )"
          detail="$(curl -4 -fsS --connect-timeout 15 --max-time 30 \
            -H "Authorization: Bearer $token" \
            "https://studio.aplus-solution.de/api/mobile/projects/$project_id/")"
          python - "$detail" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          project = data.get('project') or {}
          if not data.get('ok'):
              raise SystemExit('Reviewer project detail failed')
          if len(project.get('change_requests') or []) < 2:
              raise SystemExit('Reviewer project is missing companion change requests')
          if not project.get('store_submissions'):
              raise SystemExit('Reviewer project is missing read-only distribution status')
          for forbidden in ('preview_url', 'live_url', 'repo_url', 'deployment'):
              if forbidden in project:
                  raise SystemExit(f'Forbidden builder field exposed in detail: {forbidden}')
          print('public_companion_review_flow=verified')
          print('project=' + project.get('name', ''))
          print('change_requests=' + str(len(project.get('change_requests') or [])))
          PY

          publish_code="$(curl -4 -sS -o /tmp/publish.json -w '%{http_code}' \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{}' "https://studio.aplus-solution.de/api/mobile/projects/$project_id/publish/")"
          store_code="$(curl -4 -sS -o /tmp/store.json -w '%{http_code}' \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"platform":"ios"}' "https://studio.aplus-solution.de/api/mobile/projects/$project_id/store-submission/")"
          test "$publish_code" = "403"
          test "$store_code" = "403"

      - name: Save reviewer credentials artifact
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          {
            printf 'Email: %s\n' "$REVIEW_EMAIL"
            printf 'Password: %s\n' "$REVIEW_PASSWORD"
            printf 'Workspace: A+ Studio App Review\n'
            printf 'Pre-populated project: Luna Booking\n'
            printf 'Instructions: Sign in with this dedicated App Review account. No purchase, subscription, credits or 2FA is required. The iOS app is a project companion: it shows project status, briefings, change requests and read-only distribution status. It does not generate or preview apps, execute code, publish builds or expose billing.\n'
          } > review-credentials.txt

      - name: Upload reviewer credentials
        uses: actions/upload-artifact@v4
        with:
          name: a-studio-apple-review-credentials
          path: review-credentials.txt
          retention-days: 7
