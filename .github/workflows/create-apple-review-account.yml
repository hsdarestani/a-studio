name: Create Apple reviewer account

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/create-apple-review-account.yml'

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Generate reviewer credentials
        shell: bash
        run: |
          set -euo pipefail
          REVIEW_EMAIL='app-review@studio.aplus-solution.de'
          REVIEW_PASSWORD="$(python - <<'PY'
          import secrets, string
          alphabet = string.ascii_letters + string.digits
          print('ASa!' + ''.join(secrets.choice(alphabet) for _ in range(24)))
          PY
          )"
          echo "::add-mask::$REVIEW_PASSWORD"
          {
            echo "REVIEW_EMAIL=$REVIEW_EMAIL"
            echo "REVIEW_PASSWORD=$REVIEW_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Wait for customer-companion production API
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            if body="$(curl -4 -fsS --connect-timeout 10 --max-time 20 https://studio.aplus-solution.de/api/mobile/config/ 2>/dev/null)" && \
               python - "$body" <<'PY'
          import json, sys
          data=json.loads(sys.argv[1])
          caps=data.get('capabilities') or {}
          legal=data.get('legal') or {}
          ok=(
              data.get('mode')=='customer_project_companion'
              and caps.get('project_creation') is False
              and caps.get('account_registration') is False
              and caps.get('external_app_preview') is False
              and caps.get('mobile_publishing') is False
              and str(legal.get('privacy','')).endswith('/mobile/privacy/')
              and str(legal.get('support','')).endswith('/mobile/support/')
          )
          raise SystemExit(0 if ok else 1)
          PY
            then
              curl -4 -fsS --connect-timeout 10 --max-time 20 https://studio.aplus-solution.de/mobile/privacy/ >/dev/null
              curl -4 -fsS --connect-timeout 10 --max-time 20 https://studio.aplus-solution.de/mobile/support/ >/dev/null
              echo 'customer_companion_api=ready'
              exit 0
            fi
            sleep 5
          done
          echo 'Customer-companion production API did not become ready.' >&2
          exit 1

      - name: Create reviewer account and save credentials in Publisher
        env:
          SSHPASS: ${{ secrets.PASS }}
          HOST: ${{ secrets.HOST }}
        shell: bash
        run: |
          set -euo pipefail
          email_b64="$(printf '%s' "$REVIEW_EMAIL" | base64 -w0)"
          password_b64="$(printf '%s' "$REVIEW_PASSWORD" | base64 -w0)"
          sshpass -e ssh -o ConnectTimeout=20 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST" \
            "REVIEW_EMAIL_B64='$email_b64' REVIEW_PASSWORD_B64='$password_b64' bash -s" <<'REMOTE'
          set -euo pipefail
          export REVIEW_EMAIL="$(printf '%s' "$REVIEW_EMAIL_B64" | base64 -d)"
          export REVIEW_PASSWORD="$(printf '%s' "$REVIEW_PASSWORD_B64" | base64 -d)"

          cd /opt/a-studio/current
          docker compose exec -T \
            -e REVIEW_EMAIL="$REVIEW_EMAIL" \
            -e REVIEW_PASSWORD="$REVIEW_PASSWORD" \
            web python manage.py shell <<'PY'
          import os
          from django.contrib.auth import get_user_model
          from core.models import CreditTransaction, FeatureRequest, Membership, Organization, Project, StoreSubmission

          User = get_user_model()
          email = os.environ['REVIEW_EMAIL'].strip().lower()
          password = os.environ['REVIEW_PASSWORD']

          user = User.objects.filter(email__iexact=email).first()
          if user is None:
              user = User(username=email, email=email)
          user.username = email
          user.email = email
          user.first_name = 'App'
          user.last_name = 'Reviewer'
          user.is_active = True
          user.set_password(password)
          user.save()

          membership = Membership.objects.select_related('organization').filter(user=user).first()
          if membership:
              organization = membership.organization
          else:
              organization = Organization.objects.create(
                  name='A+ Studio App Review',
                  owner=user,
                  billing_email=email,
                  credits=0,
              )
              Membership.objects.create(organization=organization, user=user, role='owner')

          organization.name = 'A+ Studio App Review'
          organization.owner = user
          organization.billing_email = email
          organization.credits = 0
          organization.active = True
          organization.save()

          organization.projects.all().delete()
          CreditTransaction.objects.filter(organization=organization).delete()

          project = Project.objects.create(
              organization=organization,
              created_by=user,
              name='Standorteröffnung Westend',
              business_type='Kundenprojekt',
              description=(
                  'Koordination der nächsten Schritte für eine Standorteröffnung. '
                  'Der mobile Kundenbereich zeigt den aktuellen Projektfortschritt '
                  'und offene Abstimmungspunkte mit dem A+ Solution Projektteam.'
              ),
              language='de',
              status='building',
              version=1,
          )

          FeatureRequest.objects.create(
              project=project,
              requested_by=user,
              title='Nächsten Abstimmungstermin bestätigen',
              description='Bitte den nächsten Abstimmungstermin für Donnerstag bestätigen.',
              size='custom',
              credits=0,
              status='proposed',
          )
          FeatureRequest.objects.create(
              project=project,
              requested_by=user,
              title='Standortangaben geprüft',
              description='Die aktuellen Standortangaben wurden mit dem Projektteam abgestimmt.',
              size='custom',
              credits=0,
              status='done',
          )
          StoreSubmission.objects.filter(project=project).delete()

          print('review_account=ready')
          print('workspace=' + organization.name)
          print('project=' + project.name)
          print('credits=' + str(organization.credits))
          PY

          cd /opt/aplus-publisher
          docker compose exec -T \
            -e REVIEW_EMAIL="$REVIEW_EMAIL" \
            -e REVIEW_PASSWORD="$REVIEW_PASSWORD" \
            web python manage.py shell <<'PY'
          import os
          from apps.publisher.models import MobileApp

          app = MobileApp.objects.get(slug='a-studio')
          app.review_username = os.environ['REVIEW_EMAIL'].strip().lower()
          app.set_review_password(os.environ['REVIEW_PASSWORD'])
          app.requires_login = True
          app.save(update_fields=['review_username','review_password_blob','requires_login','updated_at'])
          if not app.get_review_password():
              raise SystemExit('Publisher failed to persist App Review password.')
          print('publisher_review_credentials=ready')
          print('review_username=' + app.review_username)
          PY
          REMOTE

      - name: Verify reviewer flow and mobile boundaries
        shell: bash
        run: |
          set -euo pipefail
          payload="$(python - <<'PY'
          import json, os
          print(json.dumps({'email': os.environ['REVIEW_EMAIL'], 'password': os.environ['REVIEW_PASSWORD']}))
          PY
          )"
          login_response="$(curl -4 -fsS --connect-timeout 15 --max-time 30 \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            https://studio.aplus-solution.de/api/mobile/login/)"
          token="$(python - "$login_response" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          if not data.get('ok') or not data.get('token'):
              raise SystemExit('Reviewer login verification failed')
          org = (data.get('user') or {}).get('organization') or {}
          for forbidden in ('credits', 'plan'):
              if forbidden in org:
                  raise SystemExit(f'Forbidden entitlement exposed: {forbidden}')
          print(data['token'])
          PY
          )"

          dashboard="$(curl -4 -fsS --connect-timeout 15 --max-time 30 \
            -H "Authorization: Bearer $token" \
            https://studio.aplus-solution.de/api/mobile/dashboard/)"
          project_id="$(python - "$dashboard" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          projects = data.get('projects') or []
          if not data.get('ok') or len(projects) != 1:
              raise SystemExit('Reviewer dashboard must contain one assigned project')
          project = projects[0]
          if project.get('status') != 'active':
              raise SystemExit('Reviewer project must expose neutral active status')
          for forbidden in ('preview_url','live_url','repo_url','deployment','store_submissions','change_requests'):
              if forbidden in project:
                  raise SystemExit(f'Forbidden mobile field exposed: {forbidden}')
          print(project['id'])
          PY
          )"

          detail="$(curl -4 -fsS --connect-timeout 15 --max-time 30 \
            -H "Authorization: Bearer $token" \
            "https://studio.aplus-solution.de/api/mobile/projects/$project_id/")"
          python - "$detail" <<'PY'
          import json, sys
          data=json.loads(sys.argv[1])
          project=data.get('project') or {}
          if not data.get('ok') or len(project.get('requests') or []) < 2:
              raise SystemExit('Reviewer project coordination items are missing')
          for forbidden in ('preview_url','live_url','repo_url','deployment','store_submissions','change_requests'):
              if forbidden in project:
                  raise SystemExit(f'Forbidden detail field exposed: {forbidden}')
          print('reviewer_flow=verified')
          PY

          signup_code="$(curl -4 -sS -o /tmp/signup.json -w '%{http_code}' \
            -H 'Content-Type: application/json' -d '{"email":"new@example.com","password":"x"}' \
            https://studio.aplus-solution.de/api/mobile/signup/)"
          create_code="$(curl -4 -sS -o /tmp/create.json -w '%{http_code}' \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{"name":"New"}' \
            https://studio.aplus-solution.de/api/mobile/projects/)"
          publish_code="$(curl -4 -sS -o /tmp/publish.json -w '%{http_code}' \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{}' \
            "https://studio.aplus-solution.de/api/mobile/projects/$project_id/publish/")"
          store_code="$(curl -4 -sS -o /tmp/store.json -w '%{http_code}' \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{}' \
            "https://studio.aplus-solution.de/api/mobile/projects/$project_id/store-submission/")"
          test "$signup_code" = "403"
          test "$create_code" = "403"
          test "$publish_code" = "404"
          test "$store_code" = "404"
          echo 'mobile_boundaries=verified'
