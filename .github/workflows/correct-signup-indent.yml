name: Correct signup hotfix

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  correct:
    if: github.head_ref == 'agent/fix-email-signup-500' && github.actor == 'hsdarestani'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUBTOKEN }}
      - name: Rewrite signup function safely
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('core/views.py')
          text = path.read_text()
          start = text.index('def signup(request):')
          end = text.index('\n\n@login_required\ndef dashboard', start)
          replacement = (
              'def signup(request):\n'
              '    if request.user.is_authenticated:\n'
              '        return redirect("dashboard")\n'
              '    form = SignUpForm(request.POST or None)\n'
              '    if request.method == "POST" and form.is_valid():\n'
              '        with transaction.atomic():\n'
              '            user = form.save()\n'
              '            organization = Organization.objects.create(\n'
              '                name=form.cleaned_data["company_name"],\n'
              '                owner=user,\n'
              '                billing_email=user.email,\n'
              '                credits=20,\n'
              '            )\n'
              '            Membership.objects.create(organization=organization, user=user, role="owner")\n'
              '            CreditTransaction.objects.create(\n'
              '                organization=organization,\n'
              '                kind="grant",\n'
              '                amount=20,\n'
              '                balance_after=20,\n'
              '                description=_("Welcome credits"),\n'
              '            )\n'
              '            login(request, user, backend="django.contrib.auth.backends.ModelBackend")\n'
              '        return redirect("project_create")\n'
              '    return render(request, "registration/signup.html", {"form": form})\n'
          )
          path.write_text(text[:start] + replacement + text[end:])
          PY
          python -m compileall -q core
          rm -f .github/workflows/correct-signup-indent.yml
          git config user.name 'A+ Studio Automation'
          git config user.email 'app@aplus-solution.de'
          git add -A
          git commit -m 'Correct signup hotfix indentation'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
