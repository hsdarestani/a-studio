name: Bootstrap German brand redesign

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'agent/german-brand-social-login' && github.actor == 'hsdarestani'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUBTOKEN }}
      - name: Expand verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap-brand/chunk-00 \
            .bootstrap-brand/chunk-01-02 \
            .bootstrap-brand/chunk-03-04 \
            .bootstrap-brand/chunk-05 \
            .bootstrap-brand/chunk-06 \
            .bootstrap-brand/chunk-07 \
            .bootstrap-brand/chunk-08 \
            .bootstrap-brand/chunk-09 \
            .bootstrap-brand/chunk-10 \
            .bootstrap-brand/chunk-11 \
            | base64 --decode > /tmp/astudio-brand-patch.tar.gz
          echo '818aa1400386a9790b50c77d1a1d4982e87b713ae68622fba2df5012272c4313  /tmp/astudio-brand-patch.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/astudio-brand-patch.tar.gz -C .
          rm -rf .bootstrap-brand
          git config user.name 'A+ Studio Automation'
          git config user.email 'app@aplus-solution.de'
          git add -A
          git commit -m 'Redesign A+ Studio in German with social login'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
