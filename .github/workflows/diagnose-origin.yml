name: Diagnose production origin

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  direct-origin:
    if: github.head_ref == 'agent/production-diagnose-trigger' && github.actor == 'hsdarestani'
    runs-on: ubuntu-latest
    steps:
      - name: Direct origin connectivity
        env:
          HOST: ${{ secrets.HOST }}
        shell: bash
        run: |
          set +e
          echo "Origin: $HOST"
          timeout 10 bash -c "</dev/tcp/$HOST/22" && echo '22 open' || echo '22 closed'
          timeout 10 bash -c "</dev/tcp/$HOST/80" && echo '80 open' || echo '80 closed'
          timeout 10 bash -c "</dev/tcp/$HOST/443" && echo '443 open' || echo '443 closed'
          echo 'HTTP origin response:'
          curl -sv --connect-timeout 10 --max-time 15 -H 'Host: studio.aplus-solution.de' "http://$HOST/health/" 2>&1 | tail -n 25
          echo 'HTTPS origin response:'
          curl -skv --connect-timeout 10 --max-time 15 --resolve "studio.aplus-solution.de:443:$HOST" https://studio.aplus-solution.de/health/ 2>&1 | tail -n 35

  server-state:
    if: github.head_ref == 'agent/production-diagnose-trigger' && github.actor == 'hsdarestani'
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
      - name: Origin state
        env:
          SSHPASS: ${{ secrets.PASS }}
          HOST: ${{ secrets.HOST }}
        shell: bash
        run: |
          sshpass -e ssh -o ConnectTimeout=20 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST" 'bash -s' <<'REMOTE'
          set +e
          echo 'SOCKETS'
          ss -ltnp | grep -E ':(22|80|443|8000)\b' || true
          echo 'UFW'
          command -v ufw >/dev/null && ufw status verbose || echo 'ufw unavailable'
          echo 'CONTAINERS'
          cd /opt/a-studio/current || exit 0
          docker compose ps -a
          echo 'LOCAL HTTP'
          curl -sS -D- --connect-timeout 8 -H 'Host: studio.aplus-solution.de' http://127.0.0.1/health/ -o /tmp/body-http || true
          cat /tmp/body-http 2>/dev/null || true
          echo
          echo 'LOCAL HTTPS'
          curl -skS -D- --connect-timeout 12 --resolve studio.aplus-solution.de:443:127.0.0.1 https://studio.aplus-solution.de/health/ -o /tmp/body-https || true
          cat /tmp/body-https 2>/dev/null || true
          REMOTE

  caddy-state:
    if: github.head_ref == 'agent/production-diagnose-trigger' && github.actor == 'hsdarestani'
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
      - name: Recent Caddy logs
        env:
          SSHPASS: ${{ secrets.PASS }}
          HOST: ${{ secrets.HOST }}
        shell: bash
        run: |
          sshpass -e ssh -o ConnectTimeout=20 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST" \
            "cd /opt/a-studio/current && docker compose logs --no-color --tail=65 caddy" 2>&1 | tail -n 75
