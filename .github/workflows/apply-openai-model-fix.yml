name: Apply OpenAI model fallback fix

on:
  push:
    branches: [agent/fix-openai-model-fallback]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'hsdarestani'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-openai-model-fallback
          fetch-depth: 0
          token: ${{ secrets.GITHUBTOKEN }}
      - name: Patch model configuration and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          settings = Path('studio/settings.py')
          text = settings.read_text()
          old = 'OPENAI_MODEL = env("OPENAI_MODEL", "gpt-5-mini")\n'
          new = (
              'OPENAI_MODEL = env("OPENAI_MODEL", "gpt-4.1-mini")\n'
              'OPENAI_FALLBACK_MODELS = [x.strip() for x in env("OPENAI_FALLBACK_MODELS", "gpt-4o-mini,gpt-4.1-nano").split(",") if x.strip()]\n'
          )
          if old not in text:
              raise SystemExit('settings model line not found')
          settings.write_text(text.replace(old, new, 1))

          deploy = Path('scripts/deploy.sh')
          text = deploy.read_text()
          text = text.replace(
              'OPENAI_MODEL=gpt-5-mini\n',
              'OPENAI_MODEL=gpt-4.1-mini\nOPENAI_FALLBACK_MODELS=gpt-4o-mini,gpt-4.1-nano\n',
              1,
          )
          marker = 'defaults = {\n'
          replacement = 'defaults = {\n    "OPENAI_MODEL": "gpt-4.1-mini",\n    "OPENAI_FALLBACK_MODELS": "gpt-4o-mini,gpt-4.1-nano",\n'
          if marker not in text:
              raise SystemExit('deploy defaults marker not found')
          text = text.replace(marker, replacement, 1)
          marker = 'for key, value in defaults.items():\n    values.setdefault(key, value)\n'
          replacement = (
              'for key, value in defaults.items():\n'
              '    values.setdefault(key, value)\n'
              'if values.get("OPENAI_MODEL") in {"", "gpt-5-mini"}:\n'
              '    values["OPENAI_MODEL"] = "gpt-4.1-mini"\n'
          )
          if marker not in text:
              raise SystemExit('deploy migration marker not found')
          deploy.write_text(text.replace(marker, replacement, 1))

          tests = Path('core/tests.py')
          text = tests.read_text()
          if 'from unittest.mock import Mock, patch\n' not in text:
              text = text.replace('from pathlib import Path\n', 'from pathlib import Path\nfrom unittest.mock import Mock, patch\n', 1)
          text = text.replace(
              'from .services.ai import initial_spec, sanitize_spec\n',
              'from .services.ai import initial_spec, propose_change, sanitize_spec\n',
              1,
          )
          test_method = '''
    @override_settings(OPENAI_MODEL="blocked-model", OPENAI_FALLBACK_MODELS=["working-model"])
    @patch("core.services.ai.OpenAI")
    def test_model_access_error_uses_configured_fallback(self, openai_class):
        response = Mock(output_text=json.dumps({
            "action": "apply",
            "message": "Updated safely.",
            "feature_title": "Fallback update",
            "feature_description": "Uses an accessible model.",
            "spec": self.project.app_spec,
        }))
        client = Mock()
        client.responses.create.side_effect = [Exception("model_not_found: organization must be verified"), response]
        openai_class.return_value = client

        result = propose_change(self.project, "Update the app", [])

        self.assertEqual(result["action"], "apply")
        self.assertEqual(client.responses.create.call_count, 2)
        self.assertEqual(client.responses.create.call_args_list[0].kwargs["model"], "blocked-model")
        self.assertEqual(client.responses.create.call_args_list[1].kwargs["model"], "working-model")
'''
          marker = '\n\nclass PricingTests(TestCase):\n'
          if test_method.strip() not in text:
              if marker not in text:
                  raise SystemExit('tests insertion marker not found')
              text = text.replace(marker, test_method + marker, 1)
          tests.write_text(text)
          PY
          rm -f .github/workflows/apply-openai-model-fix.yml
          git config user.name 'A+ Studio Automation'
          git config user.email 'app@aplus-solution.de'
          git add -A
          git commit -m 'Use accessible OpenAI model with automatic fallback'
          git push origin HEAD:agent/fix-openai-model-fallback
