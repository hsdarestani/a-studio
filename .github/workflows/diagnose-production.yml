name: Diagnose production edge

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/production-diagnose-trigger' && github.actor == 'hsdarestani'
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null

      - name: Runner DNS and HTTPS
        shell: bash
        run: |
          set +e
          echo '=== RUNNER DNS ==='
          getent ahostsv4 studio.aplus-solution.de || true
          getent ahostsv6 studio.aplus-solution.de || true
          echo '=== RUNNER PORTS ==='
          timeout 8 bash -c '</dev/tcp/studio.aplus-solution.de/80' && echo '80 open' || echo '80 closed/unreachable'
          timeout 8 bash -c '</dev/tcp/studio.aplus-solution.de/443' && echo '443 open' || echo '443 closed/unreachable'
          echo '=== RUNNER HTTPS ==='
          curl -4 -vk --connect-timeout 10 --max-time 20 https://studio.aplus-solution.de/health/ 2>&1 | tail -n 45

      - name: Server sockets and containers
        env:
          SSHPASS: ${{ secrets.PASS }}
          HOST: ${{ secrets.HOST }}
        shell: bash
        run: |
          sshpass -e ssh -o ConnectTimeout=20 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST" 'bash -s' <<'REMOTE'
          set +e
          echo '=== SERVER DNS ==='
          getent ahostsv4 studio.aplus-solution.de || true
          getent ahostsv6 studio.aplus-solution.de || true
          echo '=== LISTENING SOCKETS ==='
          ss -ltnp | grep -E ':(22|80|443|8000)\b' || true
          echo '=== FIREWALL ==='
          command -v ufw >/dev/null && ufw status verbose || true
          echo '=== CONTAINERS ==='
          cd /opt/a-studio/current || exit 0
          docker compose ps -a
          echo '=== LOCAL HTTP ==='
          curl -sS -D- --connect-timeout 10 -H 'Host: studio.aplus-solution.de' http://127.0.0.1/health/ -o /tmp/http-body || true
          cat /tmp/http-body 2>/dev/null || true
          echo
          echo '=== LOCAL HTTPS ==='
          curl -skS -D- --connect-timeout 15 --resolve studio.aplus-solution.de:443:127.0.0.1 https://studio.aplus-solution.de/health/ -o /tmp/https-body || true
          cat /tmp/https-body 2>/dev/null || true
          REMOTE

      - name: Caddy logs
        env:
          SSHPASS: ${{ secrets.PASS }}
          HOST: ${{ secrets.HOST }}
        shell: bash
        run: |
          sshpass -e ssh -o ConnectTimeout=20 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST" \
            "cd /opt/a-studio/current && docker compose logs --no-color --tail=90 caddy" 2>&1 | tail -n 100
