name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext >/dev/null
          pip install -r requirements.txt
      - name: Django checks
        env:
          DEBUG: '1'
          SECRET_KEY: ci-secret
          DATABASE_URL: sqlite:///db.sqlite3
          REDIS_URL: redis://localhost:6379/0
        run: |
          python manage.py compilemessages
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test
      - name: Validate generated app runtime
        run: |
          cat core/services/runtime-1.js core/services/runtime-2.js core/services/runtime-3.js > /tmp/a-studio-runtime.js
          node --check /tmp/a-studio-runtime.js
      - name: Compile Python
        run: python -m compileall -q .
      - name: Validate Caddy configuration
        run: |
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Validate production containers
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker build --tag a-studio:ci .
