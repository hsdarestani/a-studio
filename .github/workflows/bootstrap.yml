name: Bootstrap source tree

on:
  push:
    branches:
      - agent/build-a-plus-studio
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'agent/build-a-plus-studio' || github.ref == 'refs/heads/agent/build-a-plus-studio'
    runs-on: ubuntu-latest
    steps:
      - name: Check out build branch
        uses: actions/checkout@v4
        with:
          ref: agent/build-a-plus-studio
          fetch-depth: 0

      - name: Expand source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-00 .bootstrap/chunk-01 .bootstrap/chunk-02 .bootstrap/chunk-03 .bootstrap/chunk-04 .bootstrap/chunk-05 .bootstrap/chunk-06-* | base64 --decode > /tmp/a-studio-source.tar.gz
          tar -xzf /tmp/a-studio-source.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/ci.yml .github/workflows/deploy.yml

      - name: Commit source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "A+ Studio Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Build A+ Studio platform"
          git push origin HEAD:agent/build-a-plus-studio
