name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: a-studio-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name != 'pull_request' || (github.head_ref == 'agent/production-deploy-trigger' && github.actor == 'hsdarestani')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Package release
        run: tar --exclude=.git --exclude=.env -czf /tmp/a-studio-release.tar.gz .
      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Upload release
        env:
          SSHPASS: ${{ secrets.PASS }}
          HOST: ${{ secrets.HOST }}
        run: |
          sshpass -e scp -o ConnectTimeout=20 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            /tmp/a-studio-release.tar.gz root@"$HOST":/tmp/a-studio-release.tar.gz
      - name: Deploy and verify
        env:
          SSHPASS: ${{ secrets.PASS }}
          HOST: ${{ secrets.HOST }}
          OPENAI_API_KEY: ${{ secrets.OPENAIAPIKEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAILPASSWORD }}
          GITHUB_TOKEN_VALUE: ${{ secrets.GITHUBTOKEN }}
        run: |
          OPENAI_API_KEY_B64="$(printf '%s' "$OPENAI_API_KEY" | base64 -w0)"
          EMAIL_PASSWORD_B64="$(printf '%s' "$EMAIL_PASSWORD" | base64 -w0)"
          GITHUB_TOKEN_B64="$(printf '%s' "$GITHUB_TOKEN_VALUE" | base64 -w0)"
          set +e
          sshpass -e ssh -o ConnectTimeout=20 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST" \
            "OPENAI_API_KEY_B64='$OPENAI_API_KEY_B64' EMAIL_PASSWORD_B64='$EMAIL_PASSWORD_B64' GITHUB_TOKEN_B64='$GITHUB_TOKEN_B64' GITHUB_SHA='$GITHUB_SHA' bash -s" \
            < scripts/deploy.sh > /tmp/a-studio-remote-deploy.log 2>&1
          status=$?
          set -e
          tail -n 260 /tmp/a-studio-remote-deploy.log
          exit "$status"
      - name: Public HTTPS health check
        env:
          SSHPASS: ${{ secrets.PASS }}
          HOST: ${{ secrets.HOST }}
        run: |
          set +e
          echo "--- Runner DNS ---"
          getent ahostsv4 studio.aplus-solution.de || true
          getent ahostsv6 studio.aplus-solution.de || true
          echo "--- Runner HTTPS attempts ---"
          for i in $(seq 1 20); do
            if curl -4 -fsS --connect-timeout 10 https://studio.aplus-solution.de/health/; then
              exit 0
            fi
            sleep 6
          done
          echo "--- Runner verbose HTTPS ---"
          curl -4 -vk --connect-timeout 15 --max-time 30 https://studio.aplus-solution.de/health/ || true
          echo "--- Remote public-edge diagnostics ---"
          sshpass -e ssh -o ConnectTimeout=20 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST" 'bash -s' <<'REMOTE'
          set +e
          echo "DNS from server:"
          getent ahostsv4 studio.aplus-solution.de || true
          getent ahostsv6 studio.aplus-solution.de || true
          echo "Listening ports:"
          ss -ltnp | grep -E ':(22|80|443|8000)\b' || true
          cd /opt/a-studio/current || exit 0
          echo "Compose status:"
          docker compose ps -a || true
          echo "Caddy logs:"
          docker compose logs --no-color --tail=180 caddy || true
          echo "HTTP through local Caddy:"
          curl -v --connect-timeout 10 -H 'Host: studio.aplus-solution.de' http://127.0.0.1/health/ || true
          echo "HTTPS through local Caddy:"
          curl -vk --connect-timeout 15 --resolve studio.aplus-solution.de:443:127.0.0.1 https://studio.aplus-solution.de/health/ || true
          REMOTE
          exit 1
