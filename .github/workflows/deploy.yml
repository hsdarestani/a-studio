name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: a-studio-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name != 'pull_request' || (github.head_ref == 'agent/production-deploy-trigger' && github.actor == 'hsdarestani')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Package release
        run: tar --exclude=.git --exclude=.env -czf /tmp/a-studio-release.tar.gz .
      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Upload release
        env:
          SSHPASS: ${{ secrets.PASS }}
          HOST: ${{ secrets.HOST }}
        run: |
          sshpass -e scp -o ConnectTimeout=20 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            /tmp/a-studio-release.tar.gz root@"$HOST":/tmp/a-studio-release.tar.gz
      - name: Deploy and verify
        env:
          SSHPASS: ${{ secrets.PASS }}
          HOST: ${{ secrets.HOST }}
          OPENAI_API_KEY: ${{ secrets.OPENAIAPIKEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAILPASSWORD }}
          GITHUB_TOKEN_VALUE: ${{ secrets.GITHUBTOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLECLIENTID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLECLIENTSECRET }}
          APPLE_CLIENT_ID: ${{ secrets.APPLECLIENTID }}
          APPLE_KEY_ID: ${{ secrets.APPLEKEYID }}
          APPLE_TEAM_ID: ${{ secrets.APPLETEAMID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLEPRIVATEKEY }}
        run: |
          encode() { printf '%s' "$1" | base64 -w0; }
          OPENAI_API_KEY_B64="$(encode "$OPENAI_API_KEY")"
          EMAIL_PASSWORD_B64="$(encode "$EMAIL_PASSWORD")"
          GITHUB_TOKEN_B64="$(encode "$GITHUB_TOKEN_VALUE")"
          GOOGLE_CLIENT_ID_B64="$(encode "$GOOGLE_CLIENT_ID")"
          GOOGLE_CLIENT_SECRET_B64="$(encode "$GOOGLE_CLIENT_SECRET")"
          APPLE_CLIENT_ID_B64="$(encode "$APPLE_CLIENT_ID")"
          APPLE_KEY_ID_B64="$(encode "$APPLE_KEY_ID")"
          APPLE_TEAM_ID_B64="$(encode "$APPLE_TEAM_ID")"
          APPLE_PRIVATE_KEY_B64="$(encode "$APPLE_PRIVATE_KEY")"
          set +e
          sshpass -e ssh -o ConnectTimeout=20 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST" \
            "OPENAI_API_KEY_B64='$OPENAI_API_KEY_B64' EMAIL_PASSWORD_B64='$EMAIL_PASSWORD_B64' GITHUB_TOKEN_B64='$GITHUB_TOKEN_B64' GOOGLE_CLIENT_ID_B64='$GOOGLE_CLIENT_ID_B64' GOOGLE_CLIENT_SECRET_B64='$GOOGLE_CLIENT_SECRET_B64' APPLE_CLIENT_ID_B64='$APPLE_CLIENT_ID_B64' APPLE_KEY_ID_B64='$APPLE_KEY_ID_B64' APPLE_TEAM_ID_B64='$APPLE_TEAM_ID_B64' APPLE_PRIVATE_KEY_B64='$APPLE_PRIVATE_KEY_B64' GITHUB_SHA='$GITHUB_SHA' bash -s" \
            < scripts/deploy.sh > /tmp/a-studio-remote-deploy.log 2>&1
          status=$?
          set -e
          tail -n 260 /tmp/a-studio-remote-deploy.log
          exit "$status"
      - name: Public HTTPS health check
        env:
          SSHPASS: ${{ secrets.PASS }}
          HOST: ${{ secrets.HOST }}
        run: |
          set +e
          for i in $(seq 1 20); do
            if curl -4 -fsS --connect-timeout 10 https://studio.aplus-solution.de/health/; then
              exit 0
            fi
            sleep 6
          done
          curl -4 -vk --connect-timeout 15 --max-time 30 https://studio.aplus-solution.de/health/ || true
          sshpass -e ssh -o ConnectTimeout=20 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST" 'bash -s' <<'REMOTE'
          set +e
          ss -ltnp | grep -E ':(22|80|443|8000)\b' || true
          cd /opt/a-studio/current || exit 0
          docker compose ps -a || true
          docker compose logs --no-color --tail=180 caddy web || true
          REMOTE
          exit 1
