<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">A+ Solution GmbH</title>
  <desc id="desc">A+ Solution gold emblem and company name.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b7"/>
      <stop offset=".28" stop-color="#e8bd68"/>
      <stop offset=".62" stop-color="#b87820"/>
      <stop offset="1" stop-color="#f4d58d"/>
    </linearGradient>
    <linearGradient id="goldStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a86616"/>
      <stop offset=".48" stop-color="#f4d58d"/>
      <stop offset="1" stop-color="#d58b24"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
