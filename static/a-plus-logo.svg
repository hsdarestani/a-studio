  </g>
  <text x="360" y="520" text-anchor="middle" fill="url(#gold)" font-family="Georgia, 'Times New Roman', serif" font-size="58" letter-spacing="1">A+ Solution GmbH</text>
  <path d="M92 566h536" stroke="url(#goldStroke)" opacity=".38"/>
  <g fill="url(#gold)" font-family="Georgia, 'Times New Roman', serif" font-size="25">
